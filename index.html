<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de IFTS · Ciudad de Buenos Aires</title>
<meta name="description" content="Mapa de los Institutos de Formación Técnica Superior de la Ciudad de Buenos Aires. Encontrá qué carreras se dictan en cada sede.">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/estilos.css?v=20261029g">
</head>
<body>

<a class="skip-link" href="#mapa">Saltar al mapa</a>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="https://ifts16.com" target="_blank" rel="noopener" title="IFTS 16">IFTS&nbsp;—&nbsp;16</a>
    <h1 class="topbar__title">Mapa de IFTS <span class="accent">CABA</span></h1>
    <div class="topbar__actions">
      <button id="btnTema" class="icon-btn" type="button" aria-label="Cambiar a modo oscuro" title="Modo claro / oscuro">
        <svg class="ico-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="ico-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </div>
</header>

<section class="filters" aria-label="Filtros">
  <div class="filters__inner">

    <div class="filters__row">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar carrera, IFTS o barrio…" autocomplete="off" aria-label="Buscar carrera, IFTS o barrio">
      </div>

      <div class="filters__meta">
        <span id="contador" class="contador" aria-live="polite">18 IFTS</span>
        <button id="btnLimpiar" class="link-btn" type="button" hidden>Limpiar</button>
        <button id="btnLista" class="ghost-btn" type="button" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
          <span>Lista</span>
        </button>
        <button id="btnFiltros" class="ghost-btn ghost-btn--mobile" type="button" aria-expanded="false" aria-controls="panelFiltros">
          Filtros <span id="badgeFiltros" class="badge-count" hidden>0</span>
        </button>
      </div>
    </div>

    <div class="chips" id="chipsAreas" role="group" aria-label="Área de conocimiento"></div>

    <div id="panelFiltros" class="filters__panel">
      <div class="selects">
        <label class="field">
          <span class="field__label">Duración</span>
          <select id="dur">
            <option value="">Todas</option>
            <option value="1.5">1½ años</option>
            <option value="2">2 años</option>
            <option value="2.5">2½ años</option>
            <option value="3">3 años</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label">Turno</span>
          <select id="turno">
            <option value="">Todos</option>
            <option value="mañana">Mañana</option>
            <option value="tarde">Tarde</option>
            <option value="noche">Noche</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label">Modalidad</span>
          <select id="modalidad">
            <option value="">Todas</option>
            <option value="presencial">Presencial</option>
            <option value="hibrida">Híbrida</option>
            <option value="distancia">A distancia</option>
          </select>
        </label>

        <label class="field">
          <span class="field__label">Barrio</span>
          <select id="barrio"><option value="">Todos</option></select>
        </label>

        <button id="btnCerca" class="near-btn" type="button" aria-pressed="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          Cerca de mí
        </button>
      </div>

      <label class="check" id="wrapSinDato" hidden>
        <input type="checkbox" id="sinDato">
        <span>Incluir carreras sin dato de turno o duración</span>
      </label>
    </div>
  </div>
</section>

<main class="stage">
  <div id="mapa" class="mapa" role="application" aria-label="Mapa de los IFTS de la Ciudad de Buenos Aires"></div>

  <div id="vacio" class="vacio" hidden>
    <strong>No hay IFTS con esos filtros.</strong>
    <span>Probá sacando alguno o buscando otra carrera.</span>
    <button id="btnResetVacio" class="btn btn--primary" type="button">Limpiar filtros</button>
  </div>

  <aside id="panelLista" class="lista" aria-label="Resultados en lista" aria-hidden="true">
    <div class="lista__head">
      <h2 id="listaTitulo">Resultados</h2>
      <button id="btnCerrarLista" class="icon-btn" type="button" aria-label="Cerrar lista">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="listaItems" class="lista__items"></div>
  </aside>
</main>

<footer class="pie">
  <div class="pie__inner">
    <span>Datos relevados en octubre de 2026 · <a href="https://ifts16.com" target="_blank" rel="noopener">IFTS 16</a></span>
    <span class="pie__fecha" id="actualizado"></span>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="datos/ifts.js?v=20261029b"></script>
<script src="assets/app.js?v=20261029c"></script>
</body>
</html>
